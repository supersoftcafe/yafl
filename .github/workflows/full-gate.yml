name: full-gate

# Two speeds (full_protocol.py, CMakeLists.txt YAFL_TEST_SPEED). Pull requests
# and every commit to main run the full regression: a PR is opened once the
# branch is locally ready, which is when the full suite is due. Manual runs take
# the fast path unless `full` is ticked. A newer commit cancels a run still in
# progress for the same ref.
#
# The full regression is spread over several runners per architecture, each
# running one SLICE of it (full_protocol.py --levels, --suite-shard); together
# the slices are the whole regression. The compiler suite is sharded on both
# architectures, since it runs the native port. -O0 to -O2 run once, on
# aarch64: those levels test the compiler's passes, which do not depend on the
# machine, and aarch64 is the faster runner. Each of those levels is its own
# slice: a Python build of the port is the longest single step, and three in
# series made that the slowest job. -O3, the [test] folders at it, the
# collector stress test and the examples run on both, for the runtime.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full regression instead of the fast path
        type: boolean
        default: false

concurrency:
  group: full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The slices this run is made of. x86-64 and aarch64 both: the runtime's GC
  # is lock-free, and aarch64's weaker memory ordering exposes races x86 hides
  # (docs/aarch64-gc/). `cache` marks the slice that refreshes the cached -O3
  # Python build of the port, the one the fast path reuses.
  plan:
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - id: plan
        env:
          FULL: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
        run: |
          if [ "$FULL" = true ]; then
            slices='[
              {"id": "x64-o3-suite1of3", "runner": "ubuntu-latest",    "args": "--full --levels 3 --suite-shard 1/3",     "cache": true},
              {"id": "x64-suite2of3",    "runner": "ubuntu-latest",    "args": "--full --levels none --suite-shard 2/3",  "cache": false},
              {"id": "x64-suite3of3",    "runner": "ubuntu-latest",    "args": "--full --levels none --suite-shard 3/3",  "cache": false},
              {"id": "arm64-o0",         "runner": "ubuntu-24.04-arm", "args": "--full --levels 0 --suite-shard off",    "cache": false},
              {"id": "arm64-o1",         "runner": "ubuntu-24.04-arm", "args": "--full --levels 1 --suite-shard off",    "cache": false},
              {"id": "arm64-o2",         "runner": "ubuntu-24.04-arm", "args": "--full --levels 2 --suite-shard off",    "cache": false},
              {"id": "arm64-o3-suite1of2", "runner": "ubuntu-24.04-arm", "args": "--full --levels 3 --suite-shard 1/2",   "cache": true},
              {"id": "arm64-suite2of2",  "runner": "ubuntu-24.04-arm", "args": "--full --levels none --suite-shard 2/2",  "cache": false}
            ]'
          else
            slices='[
              {"id": "x64-fast",   "runner": "ubuntu-latest",    "args": "", "cache": true},
              {"id": "arm64-fast", "runner": "ubuntu-24.04-arm", "args": "", "cache": true}
            ]'
          fi
          echo "slices=$(echo "$slices" | jq -c .)" >> "$GITHUB_OUTPUT"

  full-protocol:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.slices) }}
    name: full-protocol (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system deps (clang, cmake, gdb, zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake gdb zstd

      - name: Install build and test tooling
        run: pip install pyinstaller unittest-parallel

      # The Python build of the port, reused by the fast path while the Python
      # compiler is unchanged. build_bootstrap.py checks its own keys, so any
      # earlier entry is a safe start; the full runs keep it fresh for manual
      # fast-path runs.
      - uses: actions/cache@v6
        if: matrix.cache
        with:
          path: build/bootstrap-cache
          # Everything build_bootstrap.py keys an entry on — the Python compiler,
          # the port's sources and stdlib, and the runtime it links — so an
          # entry it would relink or rebuild is saved afresh, not hit exactly.
          # The architecture too: the entry holds a native binary.
          key: bootstrap-${{ runner.arch }}-${{ hashFiles('compiler/**/*.py', '!compiler/tests/**', 'bootstrap/**/*.yafl', 'compiler/stdlib/**', 'yafllib/**') }}
          restore-keys: bootstrap-${{ runner.arch }}-

      # A crash in the port or a test binary leaves a core. Ubuntu routes cores
      # to apport unless told otherwise, so name a directory; the limit is
      # raised in the protocol step's own shell, where it has to hold.
      - name: Enable core dumps
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p

      - name: Run the protocol
        run: |
          ulimit -c unlimited
          python3 full_protocol.py ${{ matrix.args }}

      # The backtraces go in the log so they survive even when a core is too
      # big to keep. Each core is read against the binary that made it; the
      # port is linked with -g.
      - name: Backtraces from any core
        if: failure()
        run: |
          shopt -s nullglob
          for core in /tmp/cores/core.*; do
            exe=$(file "$core" | grep -o "execfn: '[^']*'" | cut -d"'" -f2)
            [ -x "$exe" ] || exe=build/yaflc
            echo "::group::$core ($exe)"
            gdb -batch -ex 'info threads' -ex 'thread apply all bt full' "$exe" "$core" 2>&1 | head -n 600
            echo "::endgroup::"
            zstd -q -T0 --rm "$core"
            # a core over 3 GB compressed is not worth the upload
            find /tmp/cores -name '*.zst' -size +3G -delete
          done
          ls -la /tmp/cores

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-failure-${{ matrix.id }}
          path: |
            /tmp/cores/
            build/yaflc
            build/yaflc.c
            build/protocol-runs/
          if-no-files-found: ignore
          retention-days: 14
