name: full-gate

# Two speeds (full_protocol.py, CMakeLists.txt YAFL_TEST_SPEED). Pull requests
# and every commit to main run the full regression: a PR is opened once the
# branch is locally ready, which is when the full suite is due. Manual runs take
# the fast path unless `full` is ticked. A newer commit cancels a run still in
# progress for the same ref.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full regression instead of the fast path
        type: boolean
        default: false

concurrency:
  group: full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # x86-64 and aarch64 both: the runtime's GC is lock-free, and aarch64's
  # weaker memory ordering exposes races x86 hides (docs/aarch64-gc/).
  full-protocol:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: full-protocol (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (clang, cmake, gdb, zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake gdb zstd

      - name: Install build and test tooling
        run: pip install pyinstaller unittest-parallel

      # The Python build of the port, reused by the fast path while the Python
      # compiler is unchanged. build_bootstrap.py checks its own keys, so any
      # earlier entry is a safe start; the full runs keep it fresh for manual
      # fast-path runs.
      - uses: actions/cache@v4
        with:
          path: build/bootstrap-cache
          # Everything build_bootstrap.py keys an entry on — the Python compiler,
          # the port's sources and stdlib, and the runtime it links — so an
          # entry it would relink or rebuild is saved afresh, not hit exactly.
          # The architecture too: the entry holds a native binary.
          key: bootstrap-${{ runner.arch }}-${{ hashFiles('compiler/**/*.py', '!compiler/tests/**', 'bootstrap/**/*.yafl', 'compiler/stdlib/**', 'yafllib/**') }}
          restore-keys: bootstrap-${{ runner.arch }}-

      # A crash in the port or a test binary leaves a core. Ubuntu routes cores
      # to apport unless told otherwise, so name a directory; the limit is
      # raised in the protocol step's own shell, where it has to hold.
      - name: Enable core dumps
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p

      - name: Run the protocol
        run: |
          ulimit -c unlimited
          python3 full_protocol.py ${{ (github.event_name != 'workflow_dispatch' || inputs.full) && '--full' || '' }}

      # The backtraces go in the log so they survive even when a core is too
      # big to keep. Each core is read against the binary that made it; the
      # port is linked with -g.
      - name: Backtraces from any core
        if: failure()
        run: |
          shopt -s nullglob
          for core in /tmp/cores/core.*; do
            exe=$(file "$core" | grep -o "execfn: '[^']*'" | cut -d"'" -f2)
            [ -x "$exe" ] || exe=build/ybootstrap
            echo "::group::$core ($exe)"
            gdb -batch -ex 'info threads' -ex 'thread apply all bt full' "$exe" "$core" 2>&1 | head -n 600
            echo "::endgroup::"
            zstd -q -T0 --rm "$core"
            # a core over 3 GB compressed is not worth the upload
            find /tmp/cores -name '*.zst' -size +3G -delete
          done
          ls -la /tmp/cores

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-failure-${{ matrix.runner }}
          path: |
            /tmp/cores/
            build/ybootstrap
            build/ybootstrap.c
            build/protocol-runs/
          if-no-files-found: ignore
          retention-days: 14
