name: n2-diag

# TEMPORARY: capture the test_gc_min2 nursery assertion seen only on
# ubuntu-24.04-arm (Neoverse N2), with docs/aarch64-gc/n2-diag.patch applied.
# Remove once diagnosed.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/n2-diag.yml, docs/aarch64-gc/n2-diag.patch]

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        builds: [clang-O2, clang-O3]
        shard: [1, 2, 3]
    name: n2-diag (${{ matrix.builds }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake
          lscpu | grep -E "Model name|^CPU\(s\)"
      - name: Apply the diagnostic patch
        run: git apply docs/aarch64-gc/n2-diag.patch
      - name: Soak test_gc_min2
        working-directory: yafllib
        run: |
          python3 tests/gc_soak.py --builds ${{ matrix.builds }} --tests test_gc_min2,test_gc_min2_window \
            --profiles default,hot,nursery4,hottrace,deftrace --minutes 45 | tee soak.log || true
          grep -h -A60 N2DIAG build/soak-logs/*/*.log > n2.txt 2>/dev/null || true
          {
            echo '### n2-diag (${{ matrix.builds }}, ${{ matrix.shard }})'
            echo '```'
            sed -n '/^build /,$p' soak.log
            grep -h N2DIAG build/soak-logs/*/*.log 2>/dev/null | cut -c1-400 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n2-diag-${{ matrix.builds }}-${{ matrix.shard }}
          path: |
            yafllib/soak.log
            yafllib/build/soak-logs/
          if-no-files-found: ignore
